<!DOCTYPE html>
<!-- Developer: محمد محمود الحموز | Dhad Studio -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الملف الشخصي - ض ستوديو</title>
  <link rel="stylesheet" href="../css/style.css?v=3.0">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script>try{var t=localStorage.getItem('dhad_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h1> الملف الشخصي</h1>
      </div>

      <div class="grid-2">
        <!-- Profile Card -->
        <div class="card">
          <div class="card-header">
            <h3>المعلومات الشخصية</h3>
          </div>
          <div class="card-body">
            <div style="text-align:center; margin-bottom:24px">
              <div class="avatar" style="width:80px;height:80px;font-size:32px;margin:0 auto 12px" id="avatar"></div>
              <h2 id="profileName"></h2>
              <p style="color:var(--text-muted)" id="profileEmail"></p>
              <span class="badge badge-info" id="profileRole"></span>
            </div>
            <div style="border-top:1px solid var(--border); padding-top:16px">
              <p style="margin-bottom:8px"><strong>تاريخ الانضمام:</strong> <span id="joinDate"></span></p>
              <p><strong>حالة الحساب:</strong> <span class="badge badge-success">نشط</span></p>
            </div>
          </div>
        </div>

        <!-- Stats Card -->
        <div class="card">
          <div class="card-header">
            <h3>الإحصائيات</h3>
          </div>
          <div class="card-body">
            <div class="stats-grid" style="margin-bottom:0">
              <div class="stat-card xp">
                <div class="stat-icon"></div>
                <div class="stat-value" id="totalXP">0</div>
                <div class="stat-label">النقاط</div>
              </div>
              <div class="stat-card level">
                <div class="stat-icon"></div>
                <div class="stat-value" id="currentLevel">1</div>
                <div class="stat-label">المستوى</div>
              </div>
              <div class="stat-card streak">
                <div class="stat-icon"></div>
                <div class="stat-value" id="currentStreak">0</div>
                <div class="stat-label">السلسلة</div>
              </div>
              <div class="stat-card challenges">
                <div class="stat-icon"></div>
                <div class="stat-value" id="completedChallenges">0</div>
                <div class="stat-label">مكتملة</div>
              </div>
            </div>

            <!-- Level Progress -->
            <div style="margin-top:24px">
              <div style="display:flex; justify-content:space-between; margin-bottom:8px">
                <span>التقدم للمستوى التالي</span>
                <span id="xpProgress">0 / 100 XP</span>
              </div>
              <div class="progress-bar">
                <div class="progress-fill green" id="xpProgressBar" style="width:0%"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/theme-switcher.js"></script>
  <script src="../js/api.js?v=4.0"></script>
  <script src="../js/toast.js?v=3.0"></script>
  <script src="../js/sidebar.js?v=3.0"></script>
  <script src="../js/profile-page.js"></script>
  <script src="../js/mobile-nav.js?v=3.0"></script>
  <script src="../js/watermark.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}</script>
</body>
</html>
