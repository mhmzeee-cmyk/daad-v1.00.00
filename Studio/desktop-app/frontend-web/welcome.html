<!DOCTYPE html>
<!-- Developer: محمد محمود الحموز | Dhad Studio -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحباً بك - ض ستوديو</title>
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
  <script>try{var t=localStorage.getItem('dhad_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); overflow: hidden; }
    
    .welcome-container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      animation: fadeInUp 0.6s ease-out;
    }
    
    .welcome-logo {
      font-size: 120px;
      font-weight: 900;
      color: var(--primary);
      text-shadow: 0 0 40px var(--primary);
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    
    .welcome-title {
      font-size: 42px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 16px;
      animation: fadeInUp 0.6s ease-out 0.2s both;
    }
    
    .welcome-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      margin-bottom: 40px;
      line-height: 1.8;
      animation: fadeInUp 0.6s ease-out 0.4s both;
    }
    
    .welcome-features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 40px;
      animation: fadeInUp 0.6s ease-out 0.6s both;
    }
    
    .feature-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 16px;
      transition: all 0.3s ease;
    }
    
    .feature-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 40px rgba(16,185,129,0.2);
      border-color: var(--primary);
    }
    
    .feature-icon {
      font-size: 36px;
      margin-bottom: 12px;
    }
    
    .feature-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    
    .feature-desc {
      font-size: 12px;
      color: var(--text-muted);
    }
    
    .welcome-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      animation: fadeInUp 0.6s ease-out 0.8s both;
    }
    
    .btn-welcome {
      padding: 16px 40px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .btn-welcome-primary {
      background: var(--primary);
      color: #000;
    }
    
    .btn-welcome-primary:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(16,185,129,0.4);
    }
    
    .btn-welcome-secondary {
      background: transparent;
      color: var(--text);
      border: 2px solid var(--border);
    }
    
    .btn-welcome-secondary:hover {
      border-color: var(--primary);
      color: var(--primary);
      transform: translateY(-2px);
    }
    
    .welcome-skip {
      margin-top: 24px;
      animation: fadeInUp 0.6s ease-out 1s both;
    }
    
    .welcome-skip a {
      color: var(--text-muted);
      font-size: 14px;
      transition: color 0.2s;
    }
    
    .welcome-skip a:hover {
      color: var(--primary);
    }
    
    /* Particles */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
    }
    
    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 15s infinite;
    }
    
    .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; animation-duration: 12s; }
    .particle:nth-child(2) { left: 20%; top: 80%; animation-delay: 2s; animation-duration: 14s; }
    .particle:nth-child(3) { left: 30%; top: 40%; animation-delay: 4s; animation-duration: 11s; }
    .particle:nth-child(4) { left: 40%; top: 60%; animation-delay: 1s; animation-duration: 13s; }
    .particle:nth-child(5) { left: 50%; top: 30%; animation-delay: 3s; animation-duration: 15s; }
    .particle:nth-child(6) { left: 60%; top: 70%; animation-delay: 5s; animation-duration: 12s; }
    .particle:nth-child(7) { left: 70%; top: 50%; animation-delay: 2s; animation-duration: 14s; }
    .particle:nth-child(8) { left: 80%; top: 90%; animation-delay: 4s; animation-duration: 11s; }
    .particle:nth-child(9) { left: 90%; top: 10%; animation-delay: 1s; animation-duration: 13s; }
    .particle:nth-child(10) { left: 15%; top: 55%; animation-delay: 3s; animation-duration: 15s; }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0.3; }
      25% { transform: translateY(-30px) translateX(15px); opacity: 0.6; }
      50% { transform: translateY(-20px) translateX(-10px); opacity: 0.3; }
      75% { transform: translateY(-40px) translateX(20px); opacity: 0.5; }
    }
    
    @media (max-width: 600px) {
      .welcome-features { grid-template-columns: 1fr; }
      .welcome-title { font-size: 28px; }
      .welcome-subtitle { font-size: 14px; }
      .welcome-actions { flex-direction: column; }
      .btn-welcome { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
  </div>
  
  <div class="welcome-container">
    <div class="welcome-logo">ض</div>
    <h1 class="welcome-title">مرحباً بك في ض ستوديو</h1>
    <p class="welcome-subtitle">منصة تعلم البرمجة بالعربية - ابدأ رحلتك في عالم التطوير الآن</p>
    
    <div class="welcome-features stagger-list">
      <div class="feature-card interactive-card shine-effect">
        <div class="feature-icon pop-hover">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        </div>
        <div class="feature-title">تعلم تفاعلي</div>
        <div class="feature-desc">دروس مصممة خصيصاً للمبتدئين</div>
      </div>
      <div class="feature-card interactive-card shine-effect">
        <div class="feature-icon pop-hover">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </div>
        <div class="feature-title">تحديات ممتعة</div>
        <div class="feature-desc">تحدى نفسك واحصل على مكافآت</div>
      </div>
      <div class="feature-card interactive-card shine-effect">
        <div class="feature-icon pop-hover">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </div>
        <div class="feature-title">تتبع التقدم</div>
        <div class="feature-desc">تابع تطورك باستمرار</div>
      </div>
    </div>
    
    <div class="welcome-actions">
      <button class="btn-welcome btn-welcome-primary magnetic-btn" onclick="goToLogin()">ابدأ الآن</button>
      <button class="btn-welcome btn-welcome-secondary magnetic-btn" onclick="goToBook()">تصفح الدليل</button>
    </div>
    
    <div class="welcome-skip">
      <a href="login.html" class="underline-slide">لديك حساب؟ تسجيل الدخول</a>
    </div>
  </div>
  
  <script src="js/api.js?v=4.0"></script>
  <script>
    (function() {
      // Check if already logged in
      if (typeof api !== 'undefined' && api.isLoggedIn()) {
        var u = api.getUser();
        if (u && (u.role === 'TEACHER' || u.role === 'ADMIN')) {
          window.location.href = 'pages/teacher-dashboard.html';
        } else if (u) {
          window.location.href = 'pages/student-dashboard.html';
        }
      }
    })();
    
    // Ripple effect on buttons
    document.querySelectorAll('.btn-welcome').forEach(function(btn) {
      btn.addEventListener('click', function(e) {
        var ripple = document.createElement('span');
        ripple.className = 'ripple-circle';
        var rect = this.getBoundingClientRect();
        var size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
        ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
        this.appendChild(ripple);
        setTimeout(function() { ripple.remove(); }, 600);
      });
    });
    
    // Magnetic effect on buttons
    document.querySelectorAll('.magnetic-btn').forEach(function(btn) {
      btn.addEventListener('mousemove', function(e) {
        var rect = this.getBoundingClientRect();
        var x = e.clientX - rect.left - rect.width / 2;
        var y = e.clientY - rect.top - rect.height / 2;
        this.style.transform = 'translate(' + (x * 0.1) + 'px, ' + (y * 0.1) + 'px) scale(1.05)';
      });
      btn.addEventListener('mouseleave', function() {
        this.style.transform = 'translate(0, 0) scale(1)';
      });
    });
    
    function goToLogin() {
      window.location.href = 'login.html';
    }
    
    function goToBook() {
      window.location.href = 'book.html';
    }
  </script>
  <script src="js/watermark.js"></script>
</body>
</html>
