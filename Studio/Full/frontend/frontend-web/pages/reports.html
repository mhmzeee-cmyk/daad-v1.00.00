<!DOCTYPE html>
<!-- Developer: محمد محمود الحموز | Dhad Studio -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التقارير - ض ستوديو</title>
  <link rel="stylesheet" href="../css/style.css?v=3.0">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script>try{var t=localStorage.getItem('dhad_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h1>التقارير</h1>
      </div>

      <div class="card" style="margin-bottom:20px">
        <div class="card-header">
          <h3>تقرير الحضور</h3>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label>اختر الفصل</label>
            <select id="attendanceClassroom" onchange="loadAttendance()">
              <option value="">اختر الفصل</option>
            </select>
          </div>
          <div id="attendanceReport">
            <div class="empty-state">
              <div class="icon"></div>
              <p>اختر فصلاً لعرض تقرير الحضور</p>
            </div>
          </div>
          <div style="margin-top:16px">
            <button class="btn btn-primary btn-sm" id="markAttendanceBtn" style="display:none" onclick="showMarkAttendance()">تسجيل الحضور اليوم</button>
          </div>
          <div id="markAttendancePanel" style="display:none;margin-top:16px;border:1px solid var(--border);border-radius:8px;padding:16px"></div>
        </div>
      </div>

      <div class="card" style="margin-bottom:20px">
        <div class="card-header">
          <h3>تقرير التقدم</h3>
        </div>
        <div class="card-body">
          <div class="form-group">
            <label>اختر الفصل</label>
            <select id="progressClassroom" onchange="loadProgress()">
              <option value="">اختر الفصل</option>
            </select>
          </div>
          <div id="progressReport">
            <div class="empty-state">
              <div class="icon"></div>
              <p>اختر فصلاً لعرض تقرير التقدم</p>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">
          <h3>تنبيهات الأمان</h3>
        </div>
        <div class="card-body" id="securityAlerts">
          <div class="empty-state">
            <div class="icon"></div>
            <p>لا توجد تنبيهات أمان حالياً</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/theme-switcher.js"></script>
  <script src="../js/api.js?v=4.0"></script>
  <script src="../js/toast.js?v=3.0"></script>
  <script src="../js/sidebar.js?v=3.0"></script>
  <script src="../js/reports-page.js"></script>
  <script src="../js/mobile-nav.js?v=3.0"></script>
  <script src="../js/watermark.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}</script>
</body>
</html>
