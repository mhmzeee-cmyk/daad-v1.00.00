<!DOCTYPE html>
<!-- Developer: محمد محمود الحموز | Dhad Studio -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الامتحانات - ض ستوديو</title>
  <link rel="stylesheet" href="../css/style.css?v=3.0">
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/animations.css">
  <script>try{var t=localStorage.getItem('dhad_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <style>
    .assessment-tabs { display:flex; gap:12px; margin-bottom:20px; }
    .assessment-tab { padding:10px 24px; border-radius:8px; cursor:pointer; border:1px solid var(--border); background:var(--bg-card); color:var(--text); transition:all 0.2s; }
    .assessment-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .assessment-tab:hover { border-color:var(--primary); }
    .question-card { background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:12px; }
    .question-card .question-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .question-card .question-num { font-weight:700; color:var(--primary); }
    .question-card .remove-btn { background:none; border:none; color:var(--danger); cursor:pointer; font-size:18px; }
    .option-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
    .option-row input[type="radio"] { accent-color:var(--primary); }
    .option-row input[type="text"] { flex:1; }
    .option-row .correct-label { font-size:12px; color:var(--secondary); white-space:nowrap; }
    .type-selector { display:flex; gap:12px; margin-bottom:20px; }
    .type-btn { flex:1; padding:16px; border:2px solid var(--border); border-radius:12px; cursor:pointer; text-align:center; background:var(--bg-card); transition:all 0.2s; }
    .type-btn.selected { border-color:var(--primary); background:rgba(16,185,129,0.1); }
    .type-btn:hover { border-color:var(--primary); }
    .type-btn h4 { margin:0 0 8px; font-size:16px; }
    .type-btn p { margin:0; font-size:13px; color:var(--text-muted); }
    .type-btn .type-icon { font-size:28px; margin-bottom:8px; }
    .student-view-card { background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:20px; margin-bottom:16px; }
    .student-view-card .question-text { font-size:15px; margin-bottom:16px; line-height:1.6; }
    .student-view-card .choices { display:flex; flex-direction:column; gap:8px; }
    .student-view-card .choice-btn { display:block; width:100%; text-align:right; padding:12px 16px; border:1px solid var(--border); border-radius:8px; background:var(--bg-card); cursor:pointer; transition:all 0.2s; color:var(--text); }
    .student-view-card .choice-btn:hover { border-color:var(--primary); background:rgba(16,185,129,0.05); }
    .student-view-card .choice-btn.selected { border-color:var(--primary); background:rgba(16,185,129,0.1); }
    .coding-area { margin-top:20px; }
    .coding-area textarea { width:100%; min-height:200px; font-family:monospace; font-size:14px; padding:12px; border:1px solid var(--border); border-radius:8px; background:var(--bg-secondary); color:var(--text); resize:vertical; direction:ltr; text-align:left; }
    .output-area { margin-top:12px; }
    .output-area pre { background:var(--bg-secondary); border:1px solid var(--border); border-radius:8px; padding:12px; min-height:60px; font-size:13px; direction:ltr; text-align:left; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h1>الامتحانات</h1>
        <button class="btn btn-primary btn-sm" id="createBtn" style="display:none" onclick="showCreateModal()">+ امتحان جديد</button>
      </div>

      <div class="card">
        <div class="card-header">
          <h3 id="tableTitle">جميع الامتحانات</h3>
        </div>
        <div class="card-body">
          <div class="table-wrapper">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="assessmentsTable">
                <tr><td colspan="6"><div class="loading"><div class="spinner"></div></div></td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Create Assessment Modal -->
  <div class="modal-overlay" id="createModal">
    <div class="modal" style="max-width:700px;max-height:85vh;overflow-y:auto">
      <h2>إنشاء امتحان جديد</h2>

      <div class="form-group">
        <label>نوع الامتحان</label>
        <div class="type-selector">
          <div class="type-btn selected" onclick="selectType('CODING')" id="typeCoding">
            <div class="type-icon">&#128187;</div>
            <h4>امتحان برمجي</h4>
            <p>طالب يكتب كود ويحصل على مخرجات متوقعة</p>
          </div>
          <div class="type-btn" onclick="selectType('MULTIPLE_CHOICE')" id="typeMC">
            <div class="type-icon">&#10067;</div>
            <h4>امتحان اختيارات</h4>
            <p>أسئلة اختيارات متعددة مع إجابة صحيحة واحدة</p>
          </div>
        </div>
      </div>

      <form id="createForm">
        <div class="form-group">
          <label>اسم الامتحان</label>
          <input type="text" id="examTitle" placeholder="مثال: امتحان الوحدة الأولى" required>
        </div>
        <div class="form-group">
          <label>الفصل</label>
          <select id="examClassroom" required>
            <option value="">اختر الفصل</option>
          </select>
        </div>
        <div class="form-group">
          <label>المدة (دقيقة)</label>
          <input type="number" id="examDuration" value="60" min="10" max="180">
        </div>
        <div class="form-group">
          <label>الوقت يبدأ</label>
          <input type="datetime-local" id="examStartTime">
        </div>

        <!-- CODING QUESTIONS SECTION -->
        <div id="codingSection">
          <h3 style="margin:20px 0 12px">التحدي البرمجي</h3>
          <div class="form-group">
            <label>عنوان التحدي</label>
            <input type="text" id="codingTitle" placeholder="مثال: انشئ آلة حاسبة">
          </div>
          <div class="form-group">
            <label>التعليمات</label>
            <textarea id="codingInstructions" rows="4" placeholder="اكتب التعليمات هنا... مثال: اكتب دالة تجمع عددين وتطبع الناتج"></textarea>
          </div>
          <div class="form-group">
            <label>كود البداية (اختياري)</label>
            <textarea id="codingStarter" rows="3" placeholder="// الكود الذي يظهر في المحرر للطالب" style="direction:ltr;text-align:left"></textarea>
          </div>
          <div class="form-group">
            <label>المخرجات المتوقعة</label>
            <input type="text" id="codingExpected" placeholder="مثال: 15" style="direction:ltr;text-align:left">
          </div>
        </div>

        <!-- MULTIPLE CHOICE QUESTIONS SECTION -->
        <div id="mcSection" style="display:none">
          <div style="display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px">
            <h3>الأسئلة</h3>
            <button type="button" class="btn btn-secondary btn-sm" onclick="addQuestion()">+ سؤال جديد</button>
          </div>
          <div id="questionsContainer"></div>
        </div>

        <div style="display:flex;gap:12px;margin-top:20px">
          <button type="submit" class="btn btn-primary">إنشاء الامتحان</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Results Modal -->
  <div class="modal-overlay" id="resultsModal">
    <div class="modal" style="max-width:700px">
      <h2 id="resultsTitle">نتائج الامتحان</h2>
      <div id="resultsContent"></div>
      <div style="margin-top:20px;display:flex;gap:12px">
        <button class="btn btn-secondary btn-sm" onclick="closeResultsModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- Assessment Taking Modal (Student) -->
  <div class="modal-overlay" id="assessmentModal">
    <div class="modal" style="max-width:800px;max-height:90vh;overflow-y:auto">
      <h2 id="assessmentModalTitle">الامتحان</h2>
      <div id="assessmentContent"></div>
      <div style="margin-top:20px;display:flex;gap:12px">
        <button class="btn btn-secondary btn-sm" onclick="closeAssessmentModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <script src="../js/theme-switcher.js"></script>
  <script src="../js/api.js?v=4.0"></script>
  <script src="../js/toast.js?v=3.0"></script>
  <script src="../js/sidebar.js?v=3.0"></script>
  <script src="../js/dhad-lexer.js?v=10.1&_=20260723"></script>
  <script src="../js/dhad-ast.js?v=10.1&_=20260723"></script>
  <script src="../js/dhad-parser.js?v=10.1&_=20260723"></script>
  <script src="../js/dhad-codegen.js?v=10.1&_=20260723"></script>
  <script src="../js/dhad.js?v=10.1&_=20260723"></script>
  <script src="../js/assessments-page.js"></script>
  <script src="../js/mobile-nav.js?v=3.0"></script>
  <script src="../js/watermark.js"></script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){})}</script>
</body>
</html>
