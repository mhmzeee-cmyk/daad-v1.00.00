<!DOCTYPE html>
<!-- Developer: محمد محمود الحموز | Dhad Studio -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استعادة كلمة المرور - ض ستوديو</title>
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/animations.css">
  <script>try{var t=localStorage.getItem('dhad_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .reset-card {
      width: 420px; padding: 40px; border-radius: 24px;
      background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow);
      text-align: center;
    }
    .arabic-letter { font-size: 64px; font-weight: 800; color: var(--primary); margin-bottom: 16px; text-shadow: 0 0 20px rgba(16,185,129,0.3); }
    .reset-card h1 { font-size: 22px; color: var(--text); margin-bottom: 8px; }
    .reset-card p { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; line-height: 1.6; }
    .input-field {
      width: 100%; padding: 12px 16px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg-input); color: var(--text); font-size: 15px; outline: none;
      margin-bottom: 16px; text-align: center; direction: rtl; box-sizing: border-box;
    }
    .input-field:focus { border-color: var(--primary); }
    .btn-submit {
      width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer;
      background: var(--primary); color: #000; font-size: 16px; font-weight: 700;
      transition: all 0.2s;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .message { padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; display: none; }
    .message.success { display: block; background: rgba(16,185,129,0.1); color: var(--primary); border: 1px solid rgba(16,185,129,0.3); }
    .message.error { display: block; background: rgba(239,68,68,0.1); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .back-link { display: block; margin-top: 20px; color: var(--text-muted); text-decoration: none; font-size: 14px; }
    .back-link:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="reset-card">
    <div class="arabic-letter">ض</div>
    <h1>استعادة كلمة المرور</h1>
    <p>أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور</p>

    <div id="message" class="message"></div>

    <form id="resetForm">
      <input type="email" id="email" class="input-field" placeholder="البريد الإلكتروني" required>
      <button type="submit" id="submitBtn" class="btn-submit">إرسال رابط الاستعادة</button>
    </form>

    <a href="login.html" class="back-link">العودة لتسجيل الدخول</a>
  </div>

  <script>
    document.getElementById('resetForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');

      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';

      try {
        const res = await fetch('/api/v1/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });

        const data = await res.json();

        if (res.ok) {
          msg.className = 'message success';
          msg.textContent = 'تم إرسال رابط إعادة تعيين كلمة المرور إلى بريدك الإلكتروني';
        } else {
          msg.className = 'message error';
          msg.textContent = data.error || 'حدث خطأ. يرجى المحاولة لاحقاً';
        }
      } catch (err) {
        msg.className = 'message error';
        msg.textContent = 'تعذر الاتصال بالخادم. يرجى المحاولة لاحقاً';
      }

      btn.disabled = false;
      btn.textContent = 'إرسال رابط الاستعادة';
    });
  </script>
</body>
</html>
