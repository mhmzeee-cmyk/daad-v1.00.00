<!DOCTYPE html>
<!-- Developer: محمد محمود الحموز | Dhad Studio -->
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>انشئ حسابك - ض استوديو</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Kufi Arabic', 'Segoe UI', Tahoma, sans-serif;
      background: #ffffff;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 40px;
    }

    /* ═══ NAVBAR ═══ */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }
    .nav-title {
      font-size: 20px;
      font-weight: 800;
      color: #1e293b;
    }
    .nav-title span {
      color: #10b981;
    }

    /* ═══ CARD ═══ */
    .card {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
    }
    .card-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .card-header h1 {
      font-size: 32px;
      font-weight: 900;
      color: #10b981;
      margin-bottom: 8px;
    }
    .card-header p {
      font-size: 15px;
      color: #64748b;
    }

    /* ═══ FORM ═══ */
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #10b981;
      margin-bottom: 8px;
    }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      color: #1e293b;
      background: #f8fafc;
      transition: all 0.2s;
      direction: rtl;
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #10b981;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(16,185,129,0.1);
    }
    .form-group input::placeholder {
      color: #94a3b8;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 8px;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16,185,129,0.4);
    }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .error-box {
      display: none;
      padding: 12px 16px;
      background: rgba(239,68,68,0.08);
      color: #dc2626;
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .footer-link {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: #64748b;
    }
    .footer-link a {
      color: #10b981;
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }

    .back-link {
      text-align: center;
      margin-top: 16px;
    }
    .back-link a {
      color: #94a3b8;
      text-decoration: none;
      font-size: 13px;
    }
    .back-link a:hover {
      color: #10b981;
    }

    /* ═══ DECORATIVE ═══ */
    .decor-top {
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(16,185,129,0.12);
      border: 2px solid rgba(16,185,129,0.2);
      top: -120px;
      left: -120px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .decor-bottom {
      position: fixed;
      width: 350px;
      height: 350px;
      background: rgba(16,185,129,0.1);
      border: 2px solid rgba(16,185,129,0.15);
      bottom: -100px;
      right: -100px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    @media (max-width: 600px) {
      .card-header h1 { font-size: 26px; }
      .navbar { padding: 12px 20px; }
    }
  </style>
  <script>try{var t=localStorage.getItem('dhad_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>
  <div class="decor-top"></div>
  <div class="decor-bottom"></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="index.html" class="nav-brand">
      <div class="nav-title"><span>ض</span> استوديو</div>
    </a>
  </nav>

  <!-- CARD -->
  <div class="card">
    <div class="card-header">
      <h1>إنشاء حساب جديد</h1>
      <p>انضم إلى منصة ض استوديو</p>
    </div>

    <div class="error-box" id="error"></div>

    <form id="registerForm">
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="name" placeholder="محمد احمد" required>
      </div>

      <div class="form-group">
        <label>البريد الالكتروني</label>
        <input type="email" id="email" placeholder="teacher@dhad.com" required>
      </div>

      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="8 احرف على الاقل" minlength="8" required>
      </div>

      <div class="form-group">
        <label>نوع الحساب</label>
        <select id="role" required>
          <option value="STUDENT">طالب</option>
          <option value="TEACHER">معلم</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">إنشاء حساب</button>
    </form>

    <div class="footer-link">
      لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </div>

    <div class="back-link">
      <a href="index.html">العودة للصفحة الرئيسية</a>
    </div>
  </div>

  <script src="js/api.js?v=4.0"></script>
  <script>
    if (api.isLoggedIn()) {
      var user = api.getUser();
      if (user) {
        var url = (user.role === 'TEACHER' || user.role === 'ADMIN')
          ? 'pages/teacher-dashboard.html'
          : 'pages/student-dashboard.html';
        window.location.href = url;
      }
    }

    function showError(msg) {
      var el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
    }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var btn = document.getElementById('submitBtn');
      var name = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var role = document.getElementById('role').value;

      document.getElementById('error').style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'جاري الإنشاء...';

      try {
        var data = await api.request('/api/v1/auth/register', {
          method: 'POST',
          body: JSON.stringify({ name: name, email: email, password: password, role: role })
        });
        api.setToken(data.accessToken);
        if (data.refreshToken) api.setRefreshToken(data.refreshToken);
        api.setUser(data.profile);
        var redirect = (role === 'TEACHER' || role === 'ADMIN')
          ? 'pages/teacher-dashboard.html'
          : 'pages/student-dashboard.html';
        window.location.href = redirect;
      } catch (ex) {
        showError(ex.message);
        btn.disabled = false;
        btn.textContent = 'إنشاء حساب';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function() {});
      });
    }
  </script>
  <script src="js/watermark.js?v=2.0"></script>
  <style>.dhad-watermark{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:-1;overflow:hidden;display:flex;flex-wrap:wrap;align-content:flex-start;gap:120px 80px;padding:40px;transform:rotate(-25deg) scale(1.1);opacity:0.012}.dhad-watermark span{display:inline-block;white-space:nowrap;font-size:11px;font-family:'Segoe UI',Tahoma,'Noto Sans Arabic',Arial,sans-serif;color:#ccc;user-select:none;-webkit-user-select:none}</style>
</body>
</html>
